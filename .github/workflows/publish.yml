name: Publish container

# Only version tags such as v3.0.0 publish an image. To redo a release, re-run its
# workflow from the Actions tab.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

env:
  REGISTRY: ghcr.io

# Runs for the same tag queue rather than cancel each other.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same checks as every push and pull request; see check.yml.
  check:
    uses: ./.github/workflows/check.yml

  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: check

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      # GHCR rejects uppercase path segments, and repository names are not
      # guaranteed to be lowercase.
      - name: Resolve image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Also adds `latest` for a release tag (not a pre-release like v3.1.0-rc.1).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Basura
            org.opencontainers.image.description=AniList lookups for Discord, literally trash

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          # Add linux/arm64 here to publish a multi-arch image. It is emulated on
          # the runner, so expect the build to take several times longer.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
